[package]
name = "kd-receipt"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared offline ReceiptV2 verifier (Ed25519 + JCS + RNG replay + math recompute) over kd-core — one engine for CLI and browser"

[dependencies]
kd-core = { path = "../kd-core" }
kd-drand = { path = "../kd-drand" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# Signing: receipt_hash = sha256 over the JCS canonical bytes. Pure + deterministic
# (no entropy), so the crate still compiles to wasm32-unknown-unknown for the Worker.
sha2 = "0.10"
# Verify-only: ChaCha20 is seeded from the receipt's drbg_key_hex (no getrandom),
# so this whole crate compiles to wasm32-unknown-unknown without an entropy backend.
rand_chacha = "0.9.0"
rand_core = "0.9.3"
