[package]
name = "kd-core"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Vissarion Zounarakis <ariszoun@gmail.com>"]
description = "TrueRolls core math: logits -> softmax -> minimal-α guarded mix (KL & EV caps) + helpers"

[features]
default = ["rand"]
rand = [] # make Params/Output serializable if you want

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2"
rand_core = "0.9.3"
rand = "0.9.2"
rand_chacha = "0.9.0"