[package]
name = "kd-api"
version = "0.1.0"
edition = "2024"
license-file.workspace = true
authors = ["Vissarion Zounarakis <aris@zounarakis.com>"]
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = "1"
futures = "0.3"
axum = { version = "0.7", features = ["macros", "json"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
dotenvy = "0.15.7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.103"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
deadpool-redis = "0.23.0"
redis = { version = "1.3.0", features = ["tokio-comp"] }
aws-config = "1.8.14"
aws-sdk-s3 = { version = "1.123.0", default-features = false, features = ["http-1x", "default-https-client", "rt-tokio"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tower   = { version = "0.5", features = ["util", "limit", "load-shed", "timeout"] }
tower_governor = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
ed25519-dalek = { workspace = true }
serde_jcs = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- Project crates
kd-core = { path = "../kd-core", features = ["rand"] }
kd-drand = { path = "../kd-drand" }
kd-receipt = { path = "../kd-receipt" } # SIG-1: the single shared receipt verifier

# --- RNG stack (all 0.9.x and aligned with kd-core)
rand_core = "0.9.3"   # explicit so the trait type matches kd-core
rand_chacha = "0.9"   # ChaCha20Rng for the drand-derived seed

# --- HKDF for deterministic seed expansion
hkdf = "0.12"

uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }

[dev-dependencies]
# Keep dev tokio aligned to avoid multiple versions in the graph
tokio   = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time"] }
