[package]
name = "kd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "TrueRolls CLI — roll dice and verify distribution invariants"

[[bin]]
name = "kd"
path = "src/main.rs"

[dependencies]
kd-core = { path = "../kd-core" }
# Single shared receipt verifier — the same engine the browser runs via wasm.
kd-receipt = { path = "../kd-receipt" }
clap = { version = "4", features = ["derive"] }
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_core = "0.9.3"
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
serde_jcs = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.12", features = ["json", "blocking"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# KD-026 golden generator: receipt_hash = "sha256:<hex>" over JCS bytes.
# Same version kd-api uses; signing deps (ed25519-dalek, serde_jcs, hex,
# base64) are already regular [dependencies] and visible to test targets.
sha2 = "0.10"


