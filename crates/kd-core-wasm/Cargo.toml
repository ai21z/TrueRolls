[package]
name = "kd-core-wasm"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "wasm-bindgen bindings for TrueRolls deterministic math and receipt verification"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kd-core = { path = "../kd-core" }
# The shared offline receipt verifier - exposed to the browser via verifyReceiptJson.
kd-receipt = { path = "../kd-receipt" }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
# kd-core's rand 0.9 chain pulls getrandom 0.3, which needs the wasm_js backend
# on wasm32-unknown-unknown (paired with the rustflags cfg in .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# float_roundtrip: serde_json's default f64 *parsing* is fast but not correctly
# rounded (off-by-1-ULP); host parity tests assert exact f64 equality after a
# JSON round-trip, so tests need correctly rounded parsing (JS JSON.parse
# already rounds correctly). Dev-only: release graphs of other crates are
# unaffected.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# Derive the published TEST verifying key from its seed for the verify parity test.
ed25519-dalek = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
