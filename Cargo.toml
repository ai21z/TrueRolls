[workspace]
members = [
    "crates/kd-api",
    "crates/kd-cli",
    "crates/kd-core",
    "crates/kd-core-wasm",
    "crates/kd-drand",
    "crates/kd-receipt",
    "crates/kd-worker-wasm",
]
resolver = "2"

[workspace.package]
edition = "2024"
license-file = "LICENSE"
version = "0.1.0"
authors = ["Vissarion Zounarakis <aris@zounarakis.com>"]
repository = "https://github.com/ai21z/truerolls"
publish = false

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
serde_jcs = "0.1"
hex = "0.4"
base64 = "0.22"
